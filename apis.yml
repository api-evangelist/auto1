name: Auto1
description: 'AUTO1 Group is Europe''s leading digital automotive platform for buying, selling, and financing
  used cars, headquartered in Berlin, Germany. It operates the B2B wholesale marketplace AUTO1.com (used
  by 60,000+ professional car dealers across 30+ European countries), the consumer retail brand Autohero,
  and the consumer purchasing service wirkaufendeinauto.de (with localized variants across Europe). The
  group combines inspection, logistics, documentation, and digital financing into an end-to-end remarketing
  and retail platform. AUTO1 Group publishes open-source engineering work through its auto1-oss GitHub
  organization, but does not expose a public developer API, developer portal, or published API documentation;
  this profile therefore captures verified company identity and domain-security posture only. Surfaced as
  a SoftBank Vision Fund portfolio company and added to the API Evangelist network for enrichment.'
